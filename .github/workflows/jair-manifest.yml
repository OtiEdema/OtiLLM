name: Build JAIR Benchmark Manifest

on:
  workflow_dispatch:
    inputs:
      n_per_dataset:
        description: "Records per benchmark"
        required: true
        default: "200"
      seed:
        description: "Deterministic sampling seed"
        required: true
        default: "42"
  push:
    branches:
      - jair-v2.0-rebuild
    paths:
      - "experiments/jair_v2_rebuild/MANIFEST_BUILD_TRIGGER"

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      N_PER_DATASET: ${{ inputs.n_per_dataset || '200' }}
      SAMPLE_SEED: ${{ inputs.seed || '42' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install benchmark tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "datasets==2.21.0"

      - name: Build manifest
        working-directory: experiments/jair_v2_rebuild
        run: |
          python prepare_hf_manifest.py \
            --n-per-dataset "$N_PER_DATASET" \
            --seed "$SAMPLE_SEED" \
            --datasets truthfulqa fever hotpotqa natural_questions \
            --out data/jair_manifest.jsonl

      - name: Validate manifest
        working-directory: experiments/jair_v2_rebuild
        run: |
          python validate_manifest.py data/jair_manifest.jsonl

      - name: Freeze provenance
        working-directory: experiments/jair_v2_rebuild
        run: |
          python freeze_manifest.py data/jair_manifest.jsonl \
            --seed "$SAMPLE_SEED" \
            --metadata-out data/jair_manifest.metadata.json

      - name: Upload frozen manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: jair-v2.0-frozen-manifest
          path: |
            experiments/jair_v2_rebuild/data/jair_manifest.jsonl
            experiments/jair_v2_rebuild/data/jair_manifest.metadata.json
          retention-days: 90
